    <title>🧪 PRUEBAS — Proyector Cloud v18.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Paleta basada en el Manual de Identidad INE (revisión 24-sept-2026); ver
      // detalle de cada escala en el bloque "colors" abajo.
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Arial', 'Helvetica', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            },
            colors: {
              // Paleta de Proyector Cloud, siguiendo los formatos oficiales del INE (2026): mucho
              // blanco, Gris medio en franjas y pestañas, y Beige/topo como único acento (palabras
              // destacadas, etiquetas y acción principal). Sin degradados. El rosa/magenta queda solo
              // en el logotipo del INE. Estados en semáforo suave (ámbar/rojo solo si hay que revisar).
              // "pink" = topo (Beige oscurecido): clave del color de acción (~240 clases: botones
              // principales, títulos de acción, iconos).
              pink: {
                50: '#FAF7F3',
                100: '#F3EDE5',
                200: '#E7DBCB',
                300: '#D6C3AA',
                400: '#C5A989',  // Beige (oficial)
                500: '#A78C6E',
                600: '#84705A',  // Topo — acción principal (4.9:1 con blanco)
                700: '#6E5D4B',
                800: '#594C3E',
                900: '#443A30',
                950: '#2D2620',
              },
              // "oxford" = gris de estructura (tarjetas principales, botones oscuros, encabezados):
              // familia del Gris medio oficial, como las franjas de los formatos del INE. El Gris
              // Oxford oficial (#454248) se veía casi negro en tarjetas grandes; los reportes
              // Excel/PDF sí lo siguen usando.
              oxford: {
                50: '#F6F7F7',
                100: '#ECEEEF',
                200: '#D9DCDE',
                300: '#C5C9CC',  // Gris claro (oficial)
                400: '#9AA1A7',
                500: '#828A91',  // Gris medio (oficial)
                600: '#6B7278',  // Tarjetas principales (4.9:1 con blanco)
                700: '#575D62',
                800: '#45494D',
                900: '#33373A',
                950: '#222426',
              },
              azul: {
                DEFAULT: '#454248',
              },
              // "violet" = gris medio de las pestañas activas.
              violet: {
                50: '#F6F7F7',
                100: '#ECEEEF',
                200: '#D9DCDE',
                300: '#C5C9CC',  // Gris claro (oficial)
                400: '#9AA1A7',
                500: '#828A91',  // Gris medio (oficial)
                600: '#6B7278',  // Pestañas activas (4.9:1 con blanco)
                700: '#575D62',
                800: '#45494D',
                900: '#33373A',
                950: '#222426',
              },
              // "beige" = acentos suaves (etiquetas, chips, palabras destacadas): Beige oficial.
              beige: {
                50: '#FAF7F3',
                100: '#F3EDE5',
                200: '#E7DBCB',
                300: '#D6C3AA',
                400: '#C5A989',  // Beige (oficial)
                500: '#A78C6E',
                600: '#84705A',
                700: '#6E5D4B',
                800: '#594C3E',
                900: '#443A30',
                950: '#2D2620',
              },
              grisCalido: {
                DEFAULT: '#DDD4CE',
              },
              // "slate" = gris neutro (textos, bordes, fondos; ~700 usos), sin tintes, como el
              // fondo blanco/gris claro de los formatos del INE. Textos de 500 en adelante ≥4.5:1.
              slate: {
                50: '#F7F7F7',
                100: '#F0F0F0',
                200: '#E4E4E4',
                300: '#CDCDCD',
                400: '#A3A3A3',
                500: '#6E6E6E',  // Texto secundario (5.1:1 con blanco)
                600: '#575757',
                700: '#464646',
                800: '#383838',
                900: '#2A2A2A',
                950: '#1C1C1C',
              },
            },
          },
        },
      };
    </script>
